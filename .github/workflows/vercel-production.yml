# Deploys medicoreerp.com to Vercel production on every push to main.
# The Vercel project is not linked to GitHub, so this workflow uses the Vercel CLI.
# Requires one repository secret: VERCEL_TOKEN (create at https://vercel.com/account/tokens).
name: Deploy to Vercel (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_YfEjrQJcl3p79CKgixj4rPDg
  VERCEL_PROJECT_ID: prj_nh0eRASAyRvuXIecBKBKsFtRnSLy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for VERCEL_TOKEN secret
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is not set; skipping deployment."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24

      - name: Install Vercel CLI
        if: steps.token.outputs.present == 'true'
        run: npm install --global vercel@67.0.0

      - name: Pull production settings and environment variables
        if: steps.token.outputs.present == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: steps.token.outputs.present == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        if: steps.token.outputs.present == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
